<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./login.css">
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="../heading/heading.css">
    <link rel="stylesheet" href="../nav/nav.css">
    <link rel="stylesheet" href="../footer/footer.css">
    <!-- Add Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCNFlfzO1EPzfrB2UNXydMq0Jo28yFeyis",
            authDomain: "vi4digserviceab-50311.firebaseapp.com",
            projectId: "vi4digserviceab-50311",
            storageBucket: "vi4digserviceab-50311.firebasestorage.app",
            messagingSenderId: "511149050934",
            appId: "1:511149050934:web:9d95a75003aa9cd22a5c97",
            measurementId: "G-JV1ESF2NP5"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.querySelector('#login-form');

            loginForm.addEventListener('submit', (event) => {
                event.preventDefault(); // Prevent the default form submission

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        // User logged in successfully
                        const user = userCredential.user;
                        alert('Login successful!');
                        // Redirect to another page or perform other actions
                        window.location.href = '../dashboard/dashboard.html'; // Change this to your desired page
                    })
                    .catch((error) => {
                        console.error('Error:', error);
                        alert('Login failed: ' + error.message);
                    });
            });
        });
    </script>
</head>
<body>
    <!-- Header Section -->
    <div id="heading"></div>
    
    <!-- Navigation Section -->
    <div id="nav"></div>

    <!-- Main Content -->
    <div id="login-content">
        <h1>Login</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="../register/register.html">Register here</a></p>
    </div>

    <!-- Footer Section -->
    <div id="footer"></div>

    <script src="./login.js"></script>
</body>
</html>
