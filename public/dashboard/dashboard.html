<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Dashboard</title>
    <link rel="stylesheet" href="../contactUs/contactUs.css">

    <!-- Add Firebase SDK -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCNFlfzO1EPzfrB2UNXydMq0Jo28yFeyis",
            authDomain: "vi4digserviceab-50311.firebaseapp.com",
            projectId: "vi4digserviceab-50311",
            storageBucket: "vi4digserviceab-50311.firebasestorage.app",
            messagingSenderId: "511149050934",
            appId: "1:511149050934:web:9d95a75003aa9cd22a5c97",
            measurementId: "G-JV1ESF2NP5"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Check if user is logged in and display username
        document.addEventListener('DOMContentLoaded', () => {
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    // User is signed in
                    const username = user.displayName || user.email; // Fallback to email if displayName is not set
                    document.getElementById('username').textContent = `Welcome, ${username}`;
                } else {
                    // No user is signed in
                    window.location.href = '../login/login.html'; // Redirect to login page if not logged in
                }
            });
        });
    </script>
</head>
<body>
    <!-- Header Section -->
    <div id="heading"></div>
    
    <!-- Navigation Section -->
    <div id="nav"></div>

    <!-- Main Content -->
    <div id="home-cleaning-content">

            Your browser does not support the video tag.
        </video>
        <h1 id="username">Welcome to the Dashboard</h1>
        <p>This is the dashboard page.</p>
    </div>

</body>
