<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="./register.css">
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="../heading/heading.css">
    <link rel="stylesheet" href="../nav/nav.css">
    <link rel="stylesheet" href="../footer/footer.css">
</head>
<body>
    <!-- Header Section -->
    <div id="heading"></div>
    
    <!-- Navigation Section -->
    <div id="nav"></div>

    <!-- Main Content -->
    <div id="register-content">
        <h1 data-lang-key="registerTitle">Register</h1>
        <form id="register-form">
            <div class="form-group">
                <label for="username" data-lang-key="usernameLabel">Username:</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="email" data-lang-key="emailLabel">Email:</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password" data-lang-key="passwordLabel">Password:</label>
                <input type="password" id="password" name="password" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm-password" data-lang-key="confirmPasswordLabel">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password">
            </div>
            <button type="submit" data-lang-key="registerButton">Register</button>
        </form>
        <p><span data-lang-key="haveAccount">Already have an account?</span> <a href="../login/login.html" data-lang-key="loginLink">Login here</a></p>
    </div>

    <!-- Footer Section -->
    <div id="footer"></div>

    <script src="./register.js"></script>
</body>
</html>
